<section class="container my-5">
  <h1>Ejemplos Control Flow Angular</h1>
  <hr>
  @if(ejemploActivo === "if"){
  <app-if-component></app-if-component>
  }@else if(ejemploActivo === "case"){
  <app-switch-component></app-switch-component>
  }@else if(ejemploActivo === "for"){

  }
</section>
