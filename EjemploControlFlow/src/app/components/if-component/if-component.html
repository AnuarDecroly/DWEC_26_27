<section class="container">
    @if(edad < 18 && edad>= 0){
        <p class="error">No puedes pasar !!!</p>
        <hr>
        <hr>
        }
        @else if (edad >= 18 && edad < 120) { <p class="acierto">Di amigo y entra</p>
            <hr>
            <hr>
            }@else {
            <p class="error">Valor de edad incorrecto</p>
            }

            <input type="number" name="edad" id="edad" (input)="cambiarEdad($event)">


</section>
