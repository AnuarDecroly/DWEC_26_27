<section>
    <div class="hero">
        <div class="text-center">
            <h1>Bienvenidos a nuestra empresa de Desarrollo Web y automatización con magIA</h1>
            <p>Ofrecemos nuestros servicios full-stack</p>
            <a class="btn btn-secondary me-3" [routerLink]="['/servicios']">Nuestros servicios</a>
            <a class="btn btn-warning" [routerLink]="['/contacto']">Contacto</a>

            <form #suscribeForm="ngForm" (submit)="getSuscribe(suscribeForm)">
                <div class="d-flex mt-3 gap-2">
                    <input type="text" name="email" id="email" class="form-control"
                        placeholder="Introduce tu email para suscribirte" ngModel>
                    <input type="submit" value="Suscribirse" class="btn btn-danger">
                </div>
            </form>
        </div>

    </div>
</section>
