<section class="container my-3">

    @if(arrayWorkers.length > 0){
    <h2>Lista de trabajadores</h2>
    <button class="btn btn-danger" (click)="eliminarTrabajador()">Eliminar Trabajador</button>
    }

    @for(worker of arrayWorkers; track $index){
    <div class="container my-3 card shadow">
        <p class="mt-3"><strong>Nombre: </strong> {{worker.nombre}}</p>
        <p class="mt-3"><strong>Email: </strong> {{worker.email}}</p>
        <p class="mt-3"><strong>Edad: </strong> {{worker.edad}}</p>
        <p class="mt-3"><strong>Cargo: </strong> {{worker.cargo}}</p>
        <p class="mt-3"><strong>Salario: </strong> {{worker.salario}}</p>
    </div>
    }
    @empty {
    <h3>No hay trabajadores</h3>
    }
    <hr>
</section>
