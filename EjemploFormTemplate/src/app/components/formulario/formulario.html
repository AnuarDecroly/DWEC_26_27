<section class="container mt-3">
    <h2>Formulario Template Decroly DAW</h2>
    <hr>
    <div>
        <form action="" class="card shadow m-3 p-5" #miFormulario="ngForm" (ngSubmit)="getDataForm(miFormulario)">
            <div>
                <label for="nombre" class="form-label">Nombre</label>
                <input class="form-control" type="text" name="nombre" id="nombre" placeholder="Introduce tu nombre"
                    ngModel>
            </div>
            <div class="mt-3">
                <label for="email" class="form-label">Email</label>
                <input class="form-control" type="text" name="email" id="email" placeholder="Introduce tu email"
                    ngModel>
            </div>
            <div class="mt-3">
                <label for="edad" class="form-label">Edad</label>
                <input class="form-control" type="number" name="edad" id="edad" placeholder="33" ngModel>
            </div>

            <div class="mt-3">
                <label for="cargo" class="form-label">Cargo</label>
                <select class="form-select" name="cargo" id="cargo" ngModel>
                    <option value="" selected>Seleciona un cargo</option>
                    <option value="Desarrollador"> Desarrollador</option>
                    <option value="SEO">SEO</option>
                    <option value="Marketing">Marketing</option>
                </select>
            </div>

            <div class="form-floating my-3">
                <input type="number" class="form-control" id="salario" name="salario" ngModel>
                <label for="salario">Salario</label>
            </div>
            <input type="submit" value="Enviar" class="btn btn-danger mt-3">
        </form>
    </div>

</section>
